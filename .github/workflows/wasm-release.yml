name: wasm release

# Publishes the browser module of the game analysis (wasm/) as a release: push a tag like `wasm-v0.1.0`. Programs that use
# it (such as a web site) download the archive and pin its checksum instead of keeping the generated files in their source.
on:
  push:
    tags: ["wasm-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nwasm -> wasm/target"
      - name: Install the wasm-bindgen-cli that matches Cargo.lock
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; print $3 }' wasm/Cargo.lock | tr -d '"')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build and pack
        run: wasm/package.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" wasm/dist/hanab-bot-wasm.tar.gz wasm/dist/hanab-bot-wasm.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "The browser module of the game analysis, built from $GITHUB_SHA. SHA-256 of the archive: $(cut -d' ' -f1 wasm/dist/hanab-bot-wasm.tar.gz.sha256)"
