[package]
name = "scala-bot-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust port of scala-bot, a deterministic Hanabi bot for hanab.live"
license = "GPL-3.0-or-later"

[lib]
name = "scala_bot"

[features]
# Compiles in the bot's debug logging (the Scala bot elides it at compile time by default).
verbose-logs = []

[dependencies]

[profile.release]
debug = false
