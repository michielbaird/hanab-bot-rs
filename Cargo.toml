[package]
name = "hanab-bot-rs"
version = "1.5.2"
edition = "2024"
description = "A Hanabi bot for hanab.live (H-Group, Referential Sieve and Reactor conventions), a Rust port of scala-bot"
license = "GPL-3.0-or-later"

[lib]
name = "hanab_bot"

[features]
default = ["net"]
# Everything that talks to the network: the `bot` and `analyze_history` binaries, downloading games by replay id.
# Without it the library (conventions, game model, endgame solver) depends on nothing but serde,
# which is what to use when embedding the bot in another program: `default-features = false`.
net = ["protocol", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:reqwest"]
# The messages of hanab.live's protocol, typed by the server's own `hanabi_protocol` crate (see `wire`), so that a change of the
# protocol is a compile error, and `BotClient`, which speaks it. Not in the library by default: it brings in schemars, jsonschema
# and chrono.
protocol = ["dep:hanabi_protocol", "dep:serde_path_to_error"]
# Counts the work the bot does (see `stats`), for the benchmark. Compiles to nothing without it.
stats = []
# Compiles in the bot's debug logging (the Scala bot elides it at compile time by default).
verbose-logs = []

[[test]]
name = "client"
path = "tests/client.rs"
required-features = ["protocol"]

[[bin]]
name = "bot"
path = "src/bin/bot.rs"
required-features = ["net"]

[[bin]]
name = "analyze_history"
path = "src/bin/analyze_history.rs"
required-features = ["net"]

[lints.clippy]
default_trait_access = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
if_not_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.26", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
# The server's protocol crate (also published on crates.io, MIT), pinned to a commit of the hanabi-live repository for now: the published
# release (0.1.0) has the `event` of a `gameEvent` message, which the server replaced with `events` on 13 November. Back to a version
# when a release has it. To follow the protocol, change `rev` and fix what no longer compiles in `wire`.
serde_path_to_error = { version = "0.1", optional = true }
hanabi_protocol = { git = "https://github.com/Hanabi-Live/hanabi-live", rev = "f1b8a236798944b890a1207bbe21a14d6ec5559b", optional = true }

# `Instant::now()` panics on `wasm32-unknown-unknown`; `web-time` reads the browser's clock instead (see `clock`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"

# The solver and the convention search are far too slow unoptimised for the tests to be meaningful.
[profile.dev]
opt-level = 2

[profile.release]
debug = false

[dev-dependencies]
regex = "1.13.1"
serde_urlencoded = "0.7"
