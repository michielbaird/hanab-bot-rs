[package]
name = "hanab-bot-rs"
version = "0.1.0"
edition = "2024"
description = "A Hanabi bot for hanab.live (H-Group, Referential Sieve and Reactor conventions), a Rust port of scala-bot"
license = "GPL-3.0-or-later"

[lib]
name = "hanab_bot"

[features]
# Compiles in the bot's debug logging (the Scala bot elides it at compile time by default).
verbose-logs = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# The solver and the convention search are far too slow unoptimised for the tests to be meaningful.
[profile.dev]
opt-level = 2

[profile.release]
debug = false

[dev-dependencies]
regex = "1.13.1"
